name: Generate Trophy
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: {} 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate trophy
        uses: ryo-ma/github-profile-trophy@v1
        with:
          username: HadiHeikal
          output: profile-trophy.svg
          theme: react
          column: 7
          no-frame: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update trophy"
          git push
